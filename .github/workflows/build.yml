name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "dispatcher.py"
      - "service_runner.py"
      - "services/**"
      - "reqs/**"
      - "downloads/**"
      - "prompt-*.wav"
      - "prompt-*.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Three models plus three Python environments make this image large;
      # free as much runner disk as possible before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            dezheen89/manyservice-in-once:latest
            dezheen89/manyservice-in-once:v1
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      - name: Print result
        run: |
          echo "### Pushed: dezheen89/manyservice-in-once:latest and :v1" >> "$GITHUB_STEP_SUMMARY"
